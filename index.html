@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
* { box-sizing: border-box; }
.f1app { font-family: 'Inter', sans-serif; background: #1B1A1F; color: #F2EFE9; min-height: 100vh; width: 100%; }
.f1app h1,.f1app h2,.f1app h3,.f1app h4 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.2px; margin: 0; }
.mono { font-family: 'JetBrains Mono', monospace; }
.f1app button { font-family: 'Inter', sans-serif; cursor: pointer; }
.btn { background: #E8A33D; color: #1B1A1F; border: none; padding: 9px 16px; border-radius: 3px; font-weight: 600; font-size: 14px; clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: #F2EFE9; border: 1px solid #4a4952; clip-path: none; }
.btn.danger { background: #C1432B; color: #F2EFE9; }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.iconBtn { background: none; border: none; color: #9C9AA3; font-size: 16px; padding: 4px 8px; }
.iconBtn:hover { color: #F2EFE9; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding: 12px 22px; background:#201F25; border-bottom: 1px solid #34333A; position: sticky; top:0; z-index: 5;}
.topbar .brand { display:flex; align-items:center; gap:10px; }
.flag { width:10px; height:22px; background: linear-gradient(180deg,#E8A33D 33%, #F2EFE9 33% 66%, #C1432B 66%); border-radius: 1px; }
.tabs { display:flex; gap:4px; padding: 0 22px; background:#201F25; border-bottom: 1px solid #34333A; overflow-x:auto; }
.tab { padding: 11px 16px; color:#9C9AA3; border-bottom: 3px solid transparent; font-weight:600; font-family:'Barlow Condensed',sans-serif; font-size:16px; white-space:nowrap;}
.tab.active { color:#F2EFE9; border-color:#E8A33D; }
.content { padding: 20px 22px 60px; max-width: 1180px; margin: 0 auto; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; }
.card { background:#232228; border:1px solid #34333A; border-radius: 4px; padding: 14px; clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
.card.flat { clip-path:none; }
.cardHead { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.cardHead .name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:18px; }
.muted { color:#9C9AA3; font-size:12.5px; }
.statRow { display:flex; align-items:center; gap:6px; font-size:12px; margin:2px 0; }
.statBarWrap { flex:1; height:6px; background:#14161A; border-radius:3px; overflow:hidden; }
.statBarFill { height:100%; }
.rowBtns { display:flex; gap:6px; margin-top:10px; }
.empty { text-align:center; padding: 50px 20px; color:#9C9AA3; border: 1px dashed #3a3944; border-radius:6px; }
.modalOverlay { position:fixed; inset:0; background:rgba(10,10,12,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
.modalBox { background:#201F25; border:1px solid #3a3944; border-radius:6px; width:560px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; }
.modalBox.wide { width: 880px; }
.modalHead { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid #34333A; }
.modalBody { padding:18px; overflow-y:auto; }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; font-size:13px; color:#c9c6bd; }
.field input[type=text], .field input[type=number], .field select, .field textarea { background:#14161A; border:1px solid #3a3944; color:#F2EFE9; padding:8px 10px; border-radius:3px; font-size:14px; font-family:'Inter',sans-serif; }
.field .radioRow { display:flex; gap:8px; flex-wrap:wrap; }
.field .radioRow label { display:flex; align-items:center; gap:5px; background:#14161A; border:1px solid #3a3944; padding:5px 9px; border-radius:3px; font-size:12.5px; }
.colorField { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
.colorField input { width:44px; height:30px; border:none; background:none; padding:0; }
.optionGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(66px,1fr)); gap:8px; max-height:260px; overflow-y:auto; padding:8px; background:#14161A; border:1px solid #3a3944; border-radius:4px; }
.optionSwatch { display:flex; flex-direction:column; align-items:center; gap:3px; background:#201F25; border:2px solid #3a3944; border-radius:4px; padding:4px 2px 6px; color:inherit; }
.optionSwatch:hover { border-color:#5a5964; }
.optionSwatch.active { border-color:#E8A33D; background:#2a2413; }
.optionSwatch span { font-size:9px; color:#9C9AA3; text-align:center; line-height:1.15; }
.optionSwatch.active span { color:#E8A33D; }
.sliderRow { margin-bottom:12px; }
.sliderLabel { display:flex; justify-content:space-between; font-size:12.5px; color:#c9c6bd; margin-bottom:3px; }
.sliderVal { font-family:'JetBrains Mono',monospace; color:#E8A33D; }
input[type=range] { -webkit-appearance:none; width:100%; height:5px; border-radius:3px; background: linear-gradient(90deg,#E8A33D var(--pct), #34333A var(--pct)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#F2EFE9; border:2px solid #E8A33D; cursor:pointer; }
.tag { display:inline-block; border:1px solid #4a4952; color:#c9c6bd; border-radius:20px; padding:2px 9px; font-size:11px; margin-right:5px; }
.twoCol { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
.section { margin-bottom:22px; }
.section h4 { font-size: 20px; margin-bottom:10px; border-left:3px solid #E8A33D; padding-left:9px; }
table.tbl { width:100%; border-collapse: collapse; font-size:13.5px; }
table.tbl th { text-align:left; color:#9C9AA3; font-weight:600; padding:7px 8px; border-bottom:1px solid #34333A; font-family:'Barlow Condensed',sans-serif; font-size:14px;}
table.tbl td { padding:7px 8px; border-bottom:1px solid #2a2930; }
table.tbl tr:hover td { background:#232228; }
.posBadge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:3px; font-weight:700; font-size:12px; font-family:'JetBrains Mono',monospace; background:#14161A; }
.podium1 { background:#E8A33D; color:#1B1A1F; }
.podium2 { background:#c9c6bd; color:#1B1A1F; }
.podium3 { background:#B0743E; color:#1B1A1F; }
.podiumScene { background: radial-gradient(circle at 50% 0%, #2a2820 0%, #1B1A1F 60%); border:1px solid #34333A; border-radius:6px; padding: 44px 20px 0; overflow:hidden; position:relative; }
.podiumScene .podiumTitle { text-align:center; margin-bottom: 26px; }
.podiumScene .podiumTitle h2 { font-size:28px; letter-spacing:.5px; }
.podiumScene .podiumTitle .muted { font-size:13px; }
.podiumRow { display:flex; align-items:flex-end; justify-content:center; gap:6px; max-width: 640px; margin: 0 auto; }
.podiumSpot { flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; }
.podiumSpot .spotAvatarWrap { position:relative; margin-bottom:2px; }
.podiumSpot .crown { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:20px; }
.podiumSpot .spotName { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; text-align:center; line-height:1.15; margin-top:2px; padding:0 2px; }
.podiumSpot .spotTeam { font-size:10.5px; color:#9C9AA3; text-align:center; padding:0 2px; }
.podiumSpot .spotPts { font-family:'JetBrains Mono',monospace; color:#E8A33D; font-size:12.5px; margin-top:2px; }
.podiumBlock { width:100%; border-radius: 4px 4px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; margin-top:8px; box-shadow: inset 0 3px 0 rgba(255,255,255,.25); }
.podiumBlock .bigPos { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:32px; line-height:1; }
.podiumBlock.b1 { height:70px; background:linear-gradient(180deg,#F4B94F,#C6851F); color:#1B1A1F; }
.podiumBlock.b2 { height:52px; background:linear-gradient(180deg,#E3E0D8,#9C9990); color:#1B1A1F; }
.podiumBlock.b3 { height:40px; background:linear-gradient(180deg,#C68A57,#8A5A31); color:#1B1A1F; }
.podiumFloor { height:14px; background:#0e0d10; margin-top:0; border-radius:0 0 4px 4px; }
.podiumFlags { display:flex; justify-content:center; gap:6px; padding: 14px 0 20px; }
.podiumFlags span { width:14px; height:10px; background:repeating-conic-gradient(#F2EFE9 0% 25%, #1B1A1F 0% 50%) 0 0/8px 8px; opacity:.7; }
.homeWrap { max-width: 760px; margin: 0 auto; padding: 60px 20px; }
.homeHero { text-align:center; margin-bottom: 40px; }
.homeHero h1 { font-size: 46px; letter-spacing: 0.5px; }
.homeHero p { color:#9C9AA3; margin-top:8px; }
.histCard { display:flex; justify-content:space-between; align-items:center; background:#232228; border:1px solid #34333A; padding:16px 18px; border-radius:5px; margin-bottom:10px; }
.histCard .n { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2F8F6B; color:#0d1512; padding:11px 20px; border-radius:5px; font-weight:600; z-index:80; box-shadow:0 4px 20px rgba(0,0,0,.4); }
.raceLine { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid #2a2930; font-size:13.5px; }
.raceLine .drvname { flex:1; }
.pageSwitch { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.pageSwitch button { background:#232228; border:1px solid #34333A; color:#c9c6bd; padding:8px 14px; border-radius:3px; font-weight:600; }
.pageSwitch button.active { background:#E8A33D; color:#1B1A1F; border-color:#E8A33D; }
.badgeRole { font-size:10.5px; padding:1px 6px; border-radius:3px; font-weight:700; margin-left:6px; }
.roleTitular { background:#2F8F6B; color:#08120d; }
.roleReserva { background:#3E7CB1; color:#08120d; }
.statusInj { color:#E8A33D; }
.statusRet { color:#9C9AA3; text-decoration: line-through; }
.statusDead { color:#C1432B; }
.helpNote { background:#232228; border:1px solid #34333A; border-left:3px solid #3E7CB1; padding:10px 12px; border-radius:4px; font-size:12.5px; color:#c9c6bd; margin-bottom:14px; }
.trackMeta { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:#c9c6bd; }
.trackEditorLayout { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.trackCanvasWrap { width: min(88vw, 52vh, 420px); flex: 0 0 auto; margin: 0 auto; }
.trackSideCol { flex: 1 1 230px; min-width: 230px; }
@media (max-width: 480px) { .modalBox { max-height: 94vh; } .modalBody { padding: 14px; } }
.incidentBox { background:#26201f; border:1px solid #4a3020; border-left:3px solid #C1432B; padding:10px 12px; border-radius:4px; font-size:13px; margin-bottom:8px; }
.emptyState { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.posGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap:6px; }
.posTile { background:#232228; border:1px solid #34333A; border-radius:4px; padding:6px 4px 5px; display:flex; flex-direction:column; align-items:center; gap:3px; }
.posTile.zero { opacity:0.45; }
.posTile .cnt { font-size:13px; font-weight:700; }
.posBar { width:100%; height:4px; background:#14161A; border-radius:2px; overflow:hidden; display:block; }
.posBar > span { display:block; height:100%; background:#E8A33D; }
.tblScroll { overflow-x:auto; }
.contractCard { background:#1d1c21; border:1px solid #34333A; border-radius:4px; padding:12px; margin-bottom:10px; }
.contractHead { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.contractMeta { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:6px 14px; font-size:13px; margin-bottom:8px; }
.growthPos { color:#2F8F6B; }
.growthNeg { color:#C1432B; }
